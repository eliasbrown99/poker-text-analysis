<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 850" role="img" aria-labelledby="title desc">
<title id="title">The database relationships behind the analysis</title><desc id="desc">One forum thread can have many hands. Each hand can have players, replies, street metrics and archetypes. One video has zero or one video_labels row. The analytical topic join uses the archetype_bridge alias mapping; dashed links are analytical joins, not foreign keys.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#86643b"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;fill:#302923}.kicker{font-size:12px;letter-spacing:1.5px;font-weight:700;fill:#86643b}.heading{font-family:Georgia,serif;font-size:23px}.body{font-size:16px}.small{font-size:14px;fill:#6e6255}.key{font-size:13px;fill:#526674;font-family:ui-monospace,Consolas,monospace}</style>
<text x="20" y="25" class="kicker" text-anchor="start">FORUM DATABASE</text>
<text x="500" y="25" class="kicker" text-anchor="start">VIDEO DATABASE</text>
<rect x="20" y="43" width="420" height="98" rx="4" fill="#faf6ee" stroke="#d3c6b3"/>
<text x="38" y="75" class="heading" text-anchor="start">Discussions · threads</text>
<text x="38" y="101" class="body" text-anchor="start">Post, source URL and reply text</text>
<text x="38" y="125" class="key" text-anchor="start">id</text>
<rect x="500" y="43" width="360" height="98" rx="4" fill="#faf6ee" stroke="#d3c6b3"/>
<text x="518" y="75" class="heading" text-anchor="start">Collected videos · videos</text>
<text x="518" y="101" class="body" text-anchor="start">Title, URL and transcript</text>
<text x="518" y="125" class="key" text-anchor="start">video_id</text>
<path d="M 230 141 V 201" fill="none" stroke="#86643b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="97.19999999999999" y="161" width="265.6" height="20" fill="#f7f2e8"/>
<text x="230" y="176" class="small" text-anchor="middle">one discussion → many hand records</text>
<path d="M 680 141 V 201" fill="none" stroke="#86643b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="539.8" y="161" width="280.40000000000003" height="20" fill="#f7f2e8"/>
<text x="680" y="176" class="small" text-anchor="middle">one video → zero or one label record</text>
<rect x="20" y="206" width="420" height="98" rx="4" fill="#eee5d8" stroke="#86643b"/>
<text x="38" y="238" class="heading" text-anchor="start">Hand accounts · hands</text>
<text x="38" y="264" class="body" text-anchor="start">Cards, position and context</text>
<text x="38" y="288" class="key" text-anchor="start">id · thread_id → threads.id</text>
<rect x="500" y="206" width="360" height="98" rx="4" fill="#faf6ee" stroke="#d3c6b3"/>
<text x="518" y="238" class="heading" text-anchor="start">Descriptors · video_labels</text>
<text x="518" y="264" class="body" text-anchor="start">Type, topics and advice estimate</text>
<text x="518" y="288" class="key" text-anchor="start">video_id → videos.video_id</text>
<path d="M 230 304 V 363" fill="none" stroke="#86643b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="97.19999999999999" y="323" width="265.6" height="20" fill="#f7f2e8"/>
<text x="230" y="338" class="small" text-anchor="middle">one hand → several related records</text>
<rect x="20" y="368" width="420" height="185" rx="4" fill="#faf6ee" stroke="#d3c6b3"/>
<text x="38" y="400" class="heading" text-anchor="start">Related tables</text>
<text x="38" y="426" class="body" text-anchor="start">players · participants</text>
<text x="38" y="449" class="body" text-anchor="start">replies · comments and tone</text>
<text x="38" y="472" class="body" text-anchor="start">street_metrics · actions by betting round</text>
<text x="38" y="495" class="body" text-anchor="start">archetypes · strategy topic tags</text>
<text x="38" y="537" class="key" text-anchor="start">each uses hand_id → hands.id</text>
<path d="M 680 304 V 363" fill="none" stroke="#86643b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="595.3" y="323" width="169.4" height="20" fill="#f7f2e8"/>
<text x="680" y="338" class="small" text-anchor="middle">expand the topic list</text>
<rect x="500" y="368" width="360" height="98" rx="4" fill="#faf6ee" stroke="#d3c6b3"/>
<text x="518" y="400" class="heading" text-anchor="start">Video–topic pairs</text>
<text x="518" y="426" class="body" text-anchor="start">One derived row per video and tag</text>
<text x="518" y="450" class="key" text-anchor="start">analysis step; not a stored table</text>
<path d="M 440 493 H 470 V 600 H 385 V 627 M 680 466 V 600 H 515 V 627" fill="none" stroke="#526674" stroke-width="1.8" stroke-dasharray="5 5"/>
<rect x="180" y="632" width="520" height="98" rx="4" fill="#eee5d8" stroke="#86643b"/>
<text x="198" y="664" class="heading" text-anchor="start">Shared topic mapping · archetype_bridge</text>
<text x="198" y="690" class="body" text-anchor="start">Wording variants → common topic labels</text>
<text x="198" y="714" class="key" text-anchor="start">dashed lines: analytical joins, not foreign keys</text>
<path d="M 440 730 V 765" fill="none" stroke="#86643b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="180" y="770" width="520" height="68" rx="4" fill="#eee5d8" stroke="#86643b"/>
<text x="198" y="802" class="heading" text-anchor="start">Count each hand–topic or video–topic pair once</text>
</svg>
