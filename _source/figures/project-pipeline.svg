<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 655" role="img" aria-labelledby="title desc">
<title id="title">Two sources, one analytical workflow</title><desc id="desc">Forum discussions and video transcripts are prepared, extracted with language models, and saved in separate SQLite databases. A shared topic dictionary connects their labels. The 2026 reading edition compares distinct records using the saved data.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#86643b"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;fill:#302923}.kicker{font-size:12px;letter-spacing:1.5px;font-weight:700;fill:#86643b}.heading{font-family:Georgia,serif;font-size:23px}.body{font-size:16px}.small{font-size:14px;fill:#6e6255}.key{font-size:13px;fill:#526674;font-family:ui-monospace,Consolas,monospace}</style>
<text x="20" y="25" class="kicker" text-anchor="start">FORUM DISCUSSIONS</text>
<text x="460" y="25" class="kicker" text-anchor="start">VIDEO TRANSCRIPTS</text>
<rect x="20" y="43" width="400" height="120" rx="4" fill="#faf6ee" stroke="#d3c6b3"/>
<text x="38" y="75" class="heading" text-anchor="start">1,003 threads</text>
<text x="38" y="101" class="body" text-anchor="start">Parse posts, replies and card suits.</text>
<text x="38" y="124" class="body" text-anchor="start">Keep the source and context.</text>
<rect x="460" y="43" width="400" height="120" rx="4" fill="#faf6ee" stroke="#d3c6b3"/>
<text x="478" y="75" class="heading" text-anchor="start">75 videos</text>
<text x="478" y="101" class="body" text-anchor="start">Retrieve segments; prepare with GPT-4.1.</text>
<text x="478" y="124" class="body" text-anchor="start">Keep raw and prepared transcripts.</text>
<path d="M 220 163 V 218" fill="none" stroke="#86643b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="87.19999999999999" y="179" width="265.6" height="20" fill="#f7f2e8"/>
<text x="220" y="194" class="small" text-anchor="middle">o4-mini extracts structured fields</text>
<path d="M 660 163 V 218" fill="none" stroke="#86643b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="530.9" y="179" width="258.20000000000005" height="20" fill="#f7f2e8"/>
<text x="660" y="194" class="small" text-anchor="middle">o4-mini assigns video descriptors</text>
<rect x="20" y="223" width="400" height="112" rx="4" fill="#faf6ee" stroke="#d3c6b3"/>
<text x="38" y="255" class="heading" text-anchor="start">Forum database</text>
<text x="38" y="281" class="body" text-anchor="start">1,037 stored hand records</text>
<text x="38" y="304" class="body" text-anchor="start">Players, actions, replies and topic tags</text>
<rect x="460" y="223" width="400" height="112" rx="4" fill="#faf6ee" stroke="#d3c6b3"/>
<text x="478" y="255" class="heading" text-anchor="start">Video database</text>
<text x="478" y="281" class="body" text-anchor="start">69 saved label records</text>
<text x="478" y="304" class="body" text-anchor="start">Topics, content type and advice estimate</text>
<path d="M 220 335 V 365 H 380 V 390" fill="none" stroke="#86643b" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 660 335 V 365 H 500 V 390" fill="none" stroke="#86643b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="180" y="395" width="520" height="94" rx="4" fill="#eee5d8" stroke="#86643b"/>
<text x="198" y="427" class="heading" text-anchor="start">A shared topic dictionary</text>
<text x="198" y="453" class="body" text-anchor="start">284 wording variants → 262 common labels</text>
<path d="M 440 489 V 544" fill="none" stroke="#86643b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="292.4" y="506" width="295.2" height="20" fill="#f7f2e8"/>
<text x="440" y="521" class="small" text-anchor="middle">2026 reading edition · saved data only</text>
<rect x="180" y="549" width="520" height="91" rx="4" fill="#eee5d8" stroke="#86643b"/>
<text x="198" y="581" class="heading" text-anchor="start">Compare the patterns</text>
<text x="198" y="607" class="body" text-anchor="start">Distinct records → topic shares and advice estimates</text>
</svg>
