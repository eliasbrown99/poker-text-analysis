<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1100" role="img" aria-labelledby="title desc">
<title id="title">Two sources, one analytical workflow</title><desc id="desc">Forum discussions and video transcripts are prepared, extracted with language models, and saved in separate SQLite databases. A shared topic dictionary connects their labels. The 2026 reading edition compares distinct records using the saved data.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#86643b"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;fill:#302923}.kicker{font-size:12px;letter-spacing:1.5px;font-weight:700;fill:#86643b}.heading{font-family:Georgia,serif;font-size:23px}.body{font-size:16px}.small{font-size:14px;fill:#6e6255}.key{font-size:13px;fill:#526674;font-family:ui-monospace,Consolas,monospace}</style>
<text x="18" y="23" class="kicker" text-anchor="start">FORUM DISCUSSIONS</text>
<rect x="18" y="40" width="324" height="112" rx="4" fill="#faf6ee" stroke="#d3c6b3"/>
<text x="36" y="72" class="heading" text-anchor="start">1,003 threads</text>
<text x="36" y="98" class="body" text-anchor="start">Parse posts, replies and card suits.</text>
<text x="36" y="121" class="body" text-anchor="start">Keep the source and context.</text>
<path d="M 180 152 V 202" fill="none" stroke="#86643b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="47.19999999999999" y="166" width="265.6" height="20" fill="#f7f2e8"/>
<text x="180" y="181" class="small" text-anchor="middle">o4-mini extracts structured fields</text>
<rect x="18" y="207" width="324" height="112" rx="4" fill="#faf6ee" stroke="#d3c6b3"/>
<text x="36" y="239" class="heading" text-anchor="start">Forum database</text>
<text x="36" y="265" class="body" text-anchor="start">1,037 stored hand records</text>
<text x="36" y="288" class="body" text-anchor="start">Players, actions, replies and tags</text>
<text x="18" y="365" class="kicker" text-anchor="start">VIDEO TRANSCRIPTS</text>
<rect x="18" y="382" width="324" height="135" rx="4" fill="#faf6ee" stroke="#d3c6b3"/>
<text x="36" y="414" class="heading" text-anchor="start">75 videos</text>
<text x="36" y="440" class="body" text-anchor="start">Retrieve transcript segments.</text>
<text x="36" y="463" class="body" text-anchor="start">GPT-4.1 prepares the text.</text>
<text x="36" y="486" class="body" text-anchor="start">Keep raw and prepared copies.</text>
<path d="M 180 517 V 567" fill="none" stroke="#86643b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.89999999999998" y="531" width="258.20000000000005" height="20" fill="#f7f2e8"/>
<text x="180" y="546" class="small" text-anchor="middle">o4-mini assigns video descriptors</text>
<rect x="18" y="572" width="324" height="112" rx="4" fill="#faf6ee" stroke="#d3c6b3"/>
<text x="36" y="604" class="heading" text-anchor="start">Video database</text>
<text x="36" y="630" class="body" text-anchor="start">69 saved label records</text>
<text x="36" y="653" class="body" text-anchor="start">Topics, type and advice estimate</text>
<path d="M 18 263 H 7 V 750 H 17" fill="none" stroke="#86643b" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 180 684 V 716" fill="none" stroke="#86643b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="18" y="721" width="324" height="135" rx="4" fill="#eee5d8" stroke="#86643b"/>
<text x="36" y="753" class="heading" text-anchor="start">A shared topic dictionary</text>
<text x="36" y="779" class="body" text-anchor="start">284 wording variants</text>
<text x="36" y="802" class="body" text-anchor="start">map to 262 common labels.</text>
<text x="36" y="825" class="body" text-anchor="start">Both sources use this mapping.</text>
<path d="M 180 856 V 919" fill="none" stroke="#86643b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="32.400000000000006" y="877" width="295.2" height="20" fill="#f7f2e8"/>
<text x="180" y="892" class="small" text-anchor="middle">2026 reading edition · saved data only</text>
<rect x="18" y="924" width="324" height="145" rx="4" fill="#eee5d8" stroke="#86643b"/>
<text x="36" y="956" class="heading" text-anchor="start">Compare the patterns</text>
<text x="36" y="982" class="body" text-anchor="start">Count each record once per topic.</text>
<text x="36" y="1005" class="body" text-anchor="start">Use a separate total per source.</text>
<text x="36" y="1028" class="body" text-anchor="start">Visualize topic shares and</text>
<text x="36" y="1051" class="body" text-anchor="start">video advice estimates.</text>
</svg>
